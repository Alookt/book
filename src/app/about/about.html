<section class="page">
  <h1 class="hed">StoryBook</h1>
  <div class="more" [style.color]="textColor">
    <input
      type="color"
      class="text-color-picker"
      aria-label="Choose text color"
      [value]="textColor"
      (input)="textColor = $any($event.target).value"
    />
    @for (sent of part; track sent) {
      <p>{{ sent }}</p>
    }
  </div>
</section>
