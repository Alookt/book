<section class="page">
  <h1>Sign in</h1>
  <form (submit)="onLogin()" #loginForm="ngForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" [(ngModel)]="credentials.username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required>
    </div>
    <button type="submit" [disabled]="!loginForm.form.valid">Login</button>
  </form>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  <p>Don't have an account? <a routerLink="/register">Sign up here</a></p>
</section>
